<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      height: 70px;
      overflow: hidden;
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      -webkit-app-region: drag;
      user-select: none;
      background: linear-gradient(135deg, #4158D0 0%, #C850C0 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 12px;
      gap: 6px;
      position: relative;
      --mini-text: #ffffff;
    }

    /* 自訂底圖（🎨 小計時器外觀），透明度可調，疊在底色上 */
    .mini-image-layer {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    body > *:not(.mini-image-layer) {
      position: relative;
      z-index: 1;
    }

    .user-name {
      color: var(--mini-text);
      opacity: 0.85;
      font-size: 12px;
      font-weight: 600;
      min-width: 28px;
      text-align: center;
    }

    .time-display {
      color: var(--mini-text);
      font-size: 26px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      flex: 1;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .controls {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .btn {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.5);
    }

    /* 視窗控制按鈕（最小化、關閉）較小 */
    .btn-sm {
      width: 22px;
      height: 22px;
      font-size: 11px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-sm:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .btn-close:hover {
      background: rgba(255, 80, 80, 0.7);
    }

    .window-controls {
      display: flex;
      flex-direction: column;
      gap: 3px;
      -webkit-app-region: no-drag;
      margin-left: 2px;
    }
  </style>
</head>
<body title="全螢幕時按 F10 顯示／隱藏小計時器">
  <div class="mini-image-layer" id="mini-image-layer"></div>
  <span class="user-name" id="user-name">品瑜</span>
  <span class="time-display" id="time-display">25:00</span>
  <div class="controls">
    <button class="btn" id="pause-btn" title="暫停">⏸</button>
    <button class="btn" id="stop-btn" title="結束計時">⏹</button>
  </div>
  <div class="window-controls">
    <button class="btn-sm" id="minimize-btn" title="最小化">─</button>
    <button class="btn-sm btn-close" id="close-btn" title="隱藏到系統匣">✕</button>
  </div>

  <script src="mini-appearance.js"></script>
  <script>
    // 套用孩子自訂的顏色／底圖；設定畫面改動時 main 會轉發 mini-appearance-changed
    function applyAppearance() {
      window.miniAppearance.apply(document.body, document.getElementById('mini-image-layer'), window.miniAppearance.load());
    }
    applyAppearance();
    window.api.on('mini-appearance-changed', applyAppearance);

    const timeDisplay = document.getElementById('time-display');
    const userNameEl = document.getElementById('user-name');
    const pauseBtn = document.getElementById('pause-btn');
    const stopBtn = document.getElementById('stop-btn');
    const minimizeBtn = document.getElementById('minimize-btn');
    const closeBtn = document.getElementById('close-btn');

    let isPaused = false;

    // 接收主進程傳來的計時更新
    // guardMode = true：線上課／收尾倒數，不能暫停，結束鈕改為提早結束
    window.api.on('update-mini-display', (timeString, userName, guardMode) => {
      timeDisplay.textContent = timeString;
      userNameEl.textContent = userName;
      pauseBtn.style.display = guardMode ? 'none' : '';
      stopBtn.title = guardMode ? '提早結束' : '結束計時';
    });

    // 接收暫停狀態同步
    window.api.on('mini-pause-state', (paused) => {
      isPaused = paused;
      pauseBtn.textContent = isPaused ? '▶' : '⏸';
      pauseBtn.title = isPaused ? '繼續' : '暫停';
    });

    // 暫停/繼續按鈕
    pauseBtn.addEventListener('click', () => {
      if (isPaused) {
        window.api.send('mini-resume');
      } else {
        window.api.send('mini-pause');
      }
    });

    // 結束計時按鈕
    stopBtn.addEventListener('click', () => {
      window.api.send('mini-stop');
    });

    // 最小化按鈕
    minimizeBtn.addEventListener('click', () => {
      window.api.send('mini-minimize');
    });

    // 關閉按鈕（隱藏到系統匣）
    closeBtn.addEventListener('click', () => {
      window.api.send('mini-close');
    });
  </script>
</body>
</html>
