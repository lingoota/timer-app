<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>休息時間</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background: #101820; color: #fff; user-select: none;
        }
        .bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 30% 30%, #2b5876, #101820 70%);
            background-size: cover; background-position: center;
            transition: opacity 1.2s ease;
        }
        .bg.next { opacity: 0; }
        .shade {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.65));
        }
        .panel {
            position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%);
            text-align: center; width: min(720px, 92vw);
            padding: 28px 32px; border-radius: 24px;
            background: rgba(10, 20, 30, 0.45); backdrop-filter: blur(10px);
        }
        .headline { font-size: 22px; opacity: 0.9; letter-spacing: 2px; }
        .countdown { font-size: 96px; font-weight: 700; line-height: 1.1; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
        .sub { font-size: 16px; opacity: 0.8; margin-bottom: 18px; }
        .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        button {
            font: inherit; font-size: 17px; color: #fff; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.35); border-radius: 999px;
            padding: 10px 22px; background: rgba(255,255,255,0.12);
        }
        button:hover { background: rgba(255,255,255,0.25); }
        .btn-wrapup { background: rgba(255, 179, 71, 0.35); border-color: rgba(255, 179, 71, 0.8); }
        .btn-class { background: rgba(80, 160, 255, 0.35); border-color: rgba(80, 160, 255, 0.8); }
        .hidden { display: none !important; }
        .slide-controls {
            position: fixed; right: 24px; top: 24px; display: flex; gap: 8px;
        }
        .slide-controls button { padding: 8px 14px; font-size: 15px; }
    </style>
</head>
<body>
    <div id="bg-a" class="bg"></div>
    <div id="bg-b" class="bg next"></div>
    <div class="shade"></div>

    <div id="slide-controls" class="slide-controls hidden">
        <button id="slide-pause" title="暫停輪播">⏸</button>
        <button id="slide-next" title="下一張">⏭</button>
    </div>

    <div class="panel">
        <div id="headline" class="headline">休息時間</div>
        <div id="countdown" class="countdown">--:--</div>
        <div id="sub" class="sub">讓眼睛休息一下，倒數結束就可以再開始計時</div>
        <div class="buttons">
            <button id="btn-wrapup" class="btn-wrapup hidden">⏳ 收尾 5 分鐘</button>
            <button id="btn-class" class="btn-class">📘 線上課</button>
            <button id="btn-screen-off">🖥️ 關閉螢幕</button>
        </div>
    </div>

    <script src="rest-screen.js"></script>
</body>
</html>
